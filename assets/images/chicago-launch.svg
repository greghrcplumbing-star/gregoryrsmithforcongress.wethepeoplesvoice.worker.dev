<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Chicago campaign launch artwork</title>
  <desc id="desc">A patriotic Chicago skyline illustration for Gregory R. Smith campaign launch materials.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061525"/>
      <stop offset="0.48" stop-color="#0b3775"/>
      <stop offset="1" stop-color="#d7ad4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe4a2"/>
      <stop offset="1" stop-color="#b98228"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="150" r="95" fill="url(#gold)" opacity=".92"/>
  <g fill="#ffffff" opacity=".9">
    <circle cx="95" cy="85" r="4"/><circle cx="165" cy="145" r="3"/><circle cx="335" cy="80" r="4"/><circle cx="520" cy="135" r="3"/><circle cx="715" cy="90" r="4"/><circle cx="850" cy="210" r="3"/>
  </g>
  <g fill="#061525">
    <rect x="40" y="415" width="80" height="245"/><rect x="145" y="360" width="95" height="300"/><rect x="270" y="455" width="78" height="205"/>
    <rect x="375" y="285" width="110" height="375"/><rect x="505" y="390" width="84" height="270"/><rect x="620" y="250" width="105" height="410"/>
    <rect x="748" y="332" width="96" height="328"/><rect x="875" y="420" width="76" height="240"/><rect x="980" y="345" width="112" height="315"/><rect x="1115" y="470" width="55" height="190"/>
  </g>
  <path d="M0 660 C220 625 410 715 615 668 C780 630 995 615 1200 660 L1200 800 L0 800 Z" fill="#f7e6bf" opacity=".9"/>
  <path d="M0 702 C235 675 410 745 620 708 C805 675 990 670 1200 710" fill="none" stroke="#a92d35" stroke-width="16" opacity=".95"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="120" fill="#fff8e7" font-size="56" font-weight="900" letter-spacing="4">CHICAGO LAUNCH</text>
    <text x="600" y="184" fill="#ffe4a2" font-size="34" font-weight="900" letter-spacing="3">AUGUST 15 · WE THE PEOPLE</text>
    <text x="600" y="745" fill="#061525" font-size="42" font-weight="900">Gregory R. Smith for Congress</text>
  </g>
</svg>
